<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>Алекс — Vibe Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #080b18;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 40%, #172657 0%, #0b1024 45%, #050711 100%);
        }

        header {
            text-align: center;
            padding: 22px 16px 12px;
        }

        .logo {
            color: #6ee7ff;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        h1 {
            margin: 12px 0 6px;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .subtitle {
            margin: 0;
            color: #aebbd8;
            font-size: 14px;
        }

        main {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .avatar-frame {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 420px;
            overflow: hidden;
            border: 1px solid rgba(93, 191, 255, 0.45);
            border-radius: 26px;
            background: rgba(13, 22, 48, 0.8);
            box-shadow:
                0 0 30px rgba(36, 145, 255, 0.13),
                inset 0 0 25px rgba(36, 145, 255, 0.06);
        }

        #did-agent-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 420px;
        }

        .hint {
            padding: 18px 10px 24px;
            text-align: center;
            color: #b7c7e8;
            font-size: 14px;
            line-height: 1.6;
        }

        .hint strong {
            color: #75e6ff;
        }

        footer {
            text-align: center;
            padding: 0 12px 18px;
            color: #657392;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            header {
                padding-top: 18px;
            }

            h1 {
                font-size: 28px;
            }

            main {
                padding: 10px;
            }

            .avatar-frame,
            #did-agent-container {
                min-height: 55vh;
                min-height: 55dvh;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">VIBE CHAT</div>
        <h1>Алекс</h1>
        <p class="subtitle">Твой голосовой AI-собеседник</p>
    </header>

    <main>
        <section class="avatar-frame">
            <div id="did-agent-container"></div>
        </section>

        <div class="hint">
            <strong>Привет! Я Алекс.</strong><br>
            Подключи микрофон, если браузер попросит разрешение,
            и начни разговор со мной.
        </div>
    </main>

    <footer>
        VIBE CHAT · AI VOICE ASSISTANT
    </footer>

    <script
        type="module"
        src="https://agent.d-id.com/v2/index.js"
        data-mode="full"
        data-client-key="ck_JPPvtrHrf9fbRa6p8s868"
        data-agent-id="v2_agt_Chl5tHuq"
        data-name="did-agent"
        data-monitor="true"
        data-light-mode="true"
        data-target-id="did-agent-container">
    </script>
</body>
</html>
